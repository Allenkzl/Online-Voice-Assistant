[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "online-voice-assistant"
version = "0.1.0"
description = "Offline wake word + voice dialogue assistant (openWakeWord, sherpa-onnx Paraformer, Qwen/DashScope)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openwakeword==0.6.0",
    "onnxruntime>=1.16.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sherpa-onnx>=1.10.0",
]

[project.scripts]
ova = "ova.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ova = []
